[workspace]
resolver = "2"
members = ["crates/lamm-core", "crates/lamm-daemon", "crates/lammctl", "crates/lamm-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/lamm"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
